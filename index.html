<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const submit = form.querySelector("button");
    const result = document.querySelector("#result");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (submit.disabled) return;
      submit.disabled = true;
      result.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const { status, topic, draft } = await reply.json();
        if (reply.ok && status === "ready") {
          result.textContent = `Тема: ${topic}\nЧерновик: ${draft}`;
        } else if (reply.ok && status === "manual_review") {
          result.textContent = "Проверьте заявку вручную.";
        } else if (reply.status === 400 && status === "invalid_input") {
          result.textContent = "Введите текст заявки.";
        } else {
          result.textContent = "Не удалось обработать заявку. Попробуйте ещё раз.";
        }
      } catch {
        result.textContent = "Не удалось обработать заявку. Попробуйте ещё раз.";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
